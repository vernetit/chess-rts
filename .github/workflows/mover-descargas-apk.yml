name: Compilar Mover Descargas (Android)
on:
  push:
    branches: [android-mover-descargas-31468]
    paths:
      - 'android/mover-descargas/**'
      - '.github/workflows/mover-descargas-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/mover-descargas
    steps:
      - uses: actions/checkout@v4
      - name: Extraer fuentes del ZIP
        run: |
          if [ -f source.zip ]; then unzip -o source.zip -d .; fi
          test -f settings.gradle
          test -f app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mover-descargas-apk
          path: android/mover-descargas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
