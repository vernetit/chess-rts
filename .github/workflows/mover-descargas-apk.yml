name: Compilar Mover Descargas (Android)
on:
  push:
    branches: [android-mover-descargas-31468]
    paths:
      - 'android/mover-descargas/**'
      - '.github/workflows/mover-descargas-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/mover-descargas
    steps:
      - uses: actions/checkout@v4
      - name: Extraer fuentes del ZIP
        run: |
          for file in mover-descargas-modular-*.zip source.zip; do
            if [ -f "$file" ]; then unzip -o "$file" -d .; fi
          done
          test -f settings.gradle
          test -f app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Instalar SDK Android
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::No se encuentra sdkmanager en $SDK_ROOT"; exit 1; fi
          echo "Usando $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mover-descargas-apk
          path: android/mover-descargas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
