name: Compilar Burbuja Grabadora (Android 13)
on:
  workflow_dispatch:
  push:
    paths:
      - 'burbuja-grabadora-modular-47392-hornero.zip'
      - '.github/workflows/burbuja-grabadora-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Descomprimir proyecto original
        shell: bash
        run: |
          set -euo pipefail
          test -f burbuja-grabadora-modular-47392-hornero.zip
          mkdir -p extracted
          unzip -q burbuja-grabadora-modular-47392-hornero.zip -d extracted
          test -f extracted/Burbuja/gradlew
          test -f extracted/Burbuja/app/build.gradle
      - name: Compilar APK
        working-directory: extracted/Burbuja
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: burbuja-grabadora-android13
          path: extracted/Burbuja/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
