name: Compilar Burbuja Grabadora (Android 13)
on:
  workflow_dispatch:
  push:
    paths:
      - 'burbuja-grabadora/**'
      - '.github/workflows/burbuja-grabadora-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: burbuja-grabadora
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: burbuja-grabadora-android13
          path: burbuja-grabadora/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
